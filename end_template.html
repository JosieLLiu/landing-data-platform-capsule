<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数据宇宙装备进度</title>
<style>
  body {
    font-family: '微软雅黑', sans-serif;
    background: #0a0a23;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  h1 {
    font-size: 2em;
    color: #00f0ff;
  }
  .progress-container {
    width: 80%;
    background: #222;
    border-radius: 25px;
    overflow: hidden;
    margin-top: 20px;
    height: 30px;
    position: relative;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00f0ff, #8a2be2);
    text-align: center;
    line-height: 30px;
    color: #fff;
    font-weight: bold;
    transition: width 0.2s ease;
  }
  .status-text {
    margin-top: 20px;
    font-size: 1.2em;
    text-align: center;
  }
  .equip-grid {
    display: flex;
    margin-top: 15px;
    gap: 5px;
  }
  .equip-slot {
    width: 30px;
    height: 30px;
    background: #333;
    border-radius: 5px;
    transition: background 0.3s;
  }
  .equip-slot.active {
    background: #00f0ff;
    box-shadow: 0 0 10px #00f0ff;
  }
</style>
</head>
<body>

<h1>🎯 全部勾满？</h1>

<div class="progress-container">
  <div class="progress-bar" id="progressBar">0%</div>
</div>

<div class="equip-grid" id="equipGrid">
  <!-- 10 个装备格子 -->
  <div class="equip-slot"></div>
  <div class="equip-slot"></div>
  <div class="equip-slot"></div>
  <div class="equip-slot"></div>
  <div class="equip-slot"></div>
  <div class="equip-slot"></div>
  <div class="equip-slot"></div>
  <div class="equip-slot"></div>
  <div class="equip-slot"></div>
  <div class="equip-slot"></div>
</div>

<div class="status-text" id="statusText">
  装备收集中……
</div>

<script>
  const progressBar = document.getElementById('progressBar');
  const statusText = document.getElementById('statusText');
  const equipGrid = document.getElementById('equipGrid').children;

  let progress = 0;

  const interval = setInterval(() => {
    progress += Math.floor(Math.random() * 11) + 5; // 每次增加 5~15%
    if (progress >= 100) progress = 100;

    progressBar.style.width = progress + '%';
    progressBar.textContent = progress + '%';

    // 装备格子亮起
    const activeSlots = Math.floor(progress / 10);
    for (let i = 0; i < equipGrid.length; i++) {
      if (i < activeSlots) {
        equipGrid[i].classList.add('active');
      } else {
        equipGrid[i].classList.remove('active');
      }
    }

    // 文本动态变化
    if (progress < 30) {
      statusText.textContent = "装备收集中……";
    } else if (progress < 60) {
      statusText.textContent = "快完成了，继续收集装备！";
    } else if (progress < 100) {
      statusText.textContent = "已接近满格，准备解锁任务……";
    } else {
      statusText.innerHTML = "✅ 已集齐装备，请下发第一个任务副本！<br>[■■■■■■■■■■] 100% 全装备槽解锁，新手保护期结束。数据宇宙，正式向你开放。";
      clearInterval(interval);
    }
  }, 200); // 每 0.2 秒更新一次
</script>

</body>
</html>
