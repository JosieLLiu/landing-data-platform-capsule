<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数据宇宙装备进度</title>
<style>
  body {
    font-family: '微软雅黑', sans-serif;
    background: #0a0a23;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  .progress-container {
    width: 80%;
    background: #222;
    border-radius: 25px;
    overflow: hidden;
    margin-top: 20px;
  }
  .progress-bar {
    height: 30px;
    width: 0%;
    background: linear-gradient(90deg, #00f0ff, #8a2be2);
    text-align: center;
    line-height: 30px;
    color: #fff;
    font-weight: bold;
    transition: width 0.3s ease;
  }
  .status-text {
    margin-top: 20px;
    font-size: 1.2em;
    text-align: center;
  }
</style>
</head>
<body>

<h1>🎯 全部勾满？</h1>
<div class="progress-container">
  <div class="progress-bar" id="progressBar">0%</div>
</div>
<div class="status-text" id="statusText">
  装备收集中……
</div>

<script>
  const progressBar = document.getElementById('progressBar');
  const statusText = document.getElementById('statusText');

  let progress = 0;

  // 模拟装备收集，每秒增加一点
  const interval = setInterval(() => {
    progress += Math.floor(Math.random() * 10) + 1; // 每次增加 1-10%
    if (progress >= 100) progress = 100;

    progressBar.style.width = progress + '%';
    progressBar.textContent = progress + '%';

    if (progress < 30) {
      statusText.textContent = "装备收集中……";
    } else if (progress < 60) {
      statusText.textContent = "快完成了，继续收集装备！";
    } else if (progress < 100) {
      statusText.textContent = "已接近满格，准备解锁任务……";
    } else {
      statusText.textContent = "✅ 已集齐装备，请下发第一个任务副本！\n[■■■■■■■■■■] 100% 全装备槽解锁，新手保护期结束。数据宇宙，正式向你开放。";
      clearInterval(interval);
    }
  }, 1000);
</script>

</body>
</html>
